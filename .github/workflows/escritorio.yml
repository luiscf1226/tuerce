# Empaca Tuerce para escritorio (apps/escritorio, Tauri) en Linux, Windows y macOS. Solo a mano: Actions → escritorio →
# Run workflow. Cada sistema deja dos artefactos: los instaladores de Tauri y `steam-<sistema>`, la carpeta lista para
# el depósito de Steam (steam/contenido/<sistema>/ en un .tar para no perder los permisos). Ver apps/escritorio/README.md.
name: escritorio

on:
  workflow_dispatch:
    inputs:
      entorno:
        description: "Con qué llaves se construye el juego"
        type: choice
        options: [produccion, vista-previa]
        default: produccion

permissions:
  contents: read

jobs:
  empacar:
    name: empacar (${{ matrix.sistema }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu viejo a propósito: el AppImage anda en los Linux con glibc igual o más nueva.
          - { sistema: linux, maquina: ubuntu-22.04 }
          - { sistema: windows, maquina: windows-latest }
          - { sistema: macos, maquina: macos-latest }
    runs-on: ${{ matrix.maquina }}
    env:
      VITE_CONVEX_URL: ${{ inputs.entorno == 'produccion' && vars.VITE_CONVEX_URL_PROD || vars.VITE_CONVEX_URL_PREVIEW }}
      VITE_CLERK_PUBLISHABLE_KEY: ${{ inputs.entorno == 'produccion' && vars.VITE_CLERK_PUBLISHABLE_KEY_PROD || vars.VITE_CLERK_PUBLISHABLE_KEY_PREVIEW }}
      VITE_SALA_URL: ${{ inputs.entorno == 'produccion' && 'https://tuerce-sala.luiscf1226.workers.dev' || 'https://tuerce-sala-preview.luiscf1226.workers.dev' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: apps/escritorio/src-tauri }
      - name: lo que Tauri pide en Linux
        if: matrix.sistema == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libgstreamer-plugins-bad1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-nice
      - run: pnpm install --frozen-lockfile
      - name: empacar
        run: pnpm escritorio:empacar
      - name: armar la carpeta de Steam
        shell: bash
        run: |
          pnpm escritorio:steam
          tar -C apps/escritorio/steam/contenido -cf steam-${{ matrix.sistema }}.tar ${{ matrix.sistema }}
      - uses: actions/upload-artifact@v4
        with:
          name: steam-${{ matrix.sistema }}
          path: steam-${{ matrix.sistema }}.tar
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: instaladores-${{ matrix.sistema }}
          path: |
            apps/escritorio/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/escritorio/src-tauri/target/release/bundle/deb/*.deb
            apps/escritorio/src-tauri/target/release/bundle/nsis/*.exe
            apps/escritorio/src-tauri/target/release/bundle/msi/*.msi
            apps/escritorio/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: warn
